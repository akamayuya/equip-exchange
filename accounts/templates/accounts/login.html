{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <section class="hero-panel">
      <div class="eyebrow mb-3">アカウント</div>
      <h2 class="display-title mb-3">承認済みアカウントでログイン</h2>
      <p class="muted-copy mb-0">購入者、出品者、管理者の発表用アカウントをここから切り替えて使えます。</p>
    </section>
  </div>
</div>

<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <form method="post" class="panel p-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      {% for field in form %}
      <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
        <div class="text-danger small">{{ field.errors }}</div>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>

    <p class="mt-3 mb-0 muted-copy">
      アカウントをお持ちでない場合は
      <a href="{% url 'signup' %}">新規登録</a>
    </p>
  </div>
</div>

{% endblock %}
