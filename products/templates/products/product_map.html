{% extends "base.html" %}

{% block content %}

<section class="hero-panel mb-4">
    <div class="row align-items-end g-4">
        <div class="col-lg-8">
            <div class="eyebrow mb-3">地図検索</div>
            <h2 class="display-title mb-3">機材マップ</h2>
            <p class="muted-copy mb-0">商品名や会社所在地で絞り込みながら、出品企業の位置を地図で確認できます。</p>
        </div>
        <div class="col-lg-4">
            <div class="action-row justify-content-lg-end">
                <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">一覧に戻る</a>
            </div>
        </div>
    </div>
</section>

<section class="panel p-4 mb-4">
    <form method="get" class="row g-3 align-items-end">
        <div class="col-lg-9">
            <label for="map-search" class="form-label">マップ検索</label>
            <input
                id="map-search"
                type="text"
                name="q"
                value="{{ search_query }}"
                class="form-control"
                placeholder="商品名、会社所在地、法人名、ニックネームで検索"
            >
        </div>
        <div class="col-lg-3">
            <div class="action-row justify-content-lg-end">
                <button type="submit" class="btn btn-primary">絞り込む</button>
                {% if search_query %}
                <a href="{% url 'product_map' %}" class="btn btn-outline-secondary">クリア</a>
                {% endif %}
            </div>
        </div>
    </form>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
    .map-shell {
        overflow: hidden;
        border-radius: var(--radius-xl);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
        box-shadow: var(--shadow);
    }

    #map {
        height: 620px;
    }

    #map .leaflet-tile {
        filter: saturate(0.5) brightness(1.1) contrast(0.86);
        opacity: 0.74;
    }

    .equip-marker {
        position: relative;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--brand);
        border: 3px solid rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
    }

    .equip-marker::after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: rgba(15, 118, 110, 0.16);
        z-index: -1;
    }

    .leaflet-popup-content-wrapper {
        border-radius: 18px;
        box-shadow: 0 18px 36px rgba(31, 41, 51, 0.16);
        padding: 0;
    }

    .leaflet-popup-content {
        margin: 0;
        min-width: 220px;
    }

    .map-popup {
        padding: 16px;
    }

    .map-popup-title {
        display: block;
        font-weight: 700;
        color: var(--brand-deep);
        margin-bottom: 8px;
    }

    .map-popup-address {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 12px;
    }

    .map-popup-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        font-weight: 700;
    }

    .map-popup-link:hover {
        color: #fff;
        background: var(--brand-deep);
    }
</style>

{% if not map_companies %}
<div class="stream-note mb-4">
    {% if search_query %}
    「{{ search_query }}」に一致する地図表示可能な法人はありません。
    {% else %}
    地図表示できる法人はありません。
    {% endif %}
</div>
{% endif %}

<div class="map-shell">
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([35.681236, 139.767125], 10);

L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
    maxZoom: 18
}).addTo(map);

var productIcon = L.divIcon({
    className: '',
    html: '<div class="equip-marker"></div>',
    iconSize: [22, 22],
    iconAnchor: [11, 11],
    popupAnchor: [0, -12]
});


// Django → JS データ変換（null 安全に出力）
var companies = [
{% for company in map_companies %}
{
    companyId: {{ company.company_id }},
    companyName: "{{ company.company_name|escapejs }}",
    lat: {{ company.latitude|default_if_none:"null" }},
    lng: {{ company.longitude|default_if_none:"null" }},
    address: "{{ company.address|escapejs }}",
    productCount: {{ company.product_count }},
    latestProductName: "{{ company.latest_product_name|escapejs }}",
    url: "{% url 'product_list' %}?company={{ company.company_id }}"
}{% if not forloop.last %},{% endif %}
{% endfor %}
];

// デバッグ
console.log("companies for map:", companies);

// ピン表示
companies.forEach(function(company){

    // 厳密な null チェック（0 を許容、文字列 "null" を回避）
    if (company.lat !== null && company.lng !== null) {

        // 数値として扱う（テンプレートからは数値または null が来る想定）
        var lat = Number(company.lat);
        var lng = Number(company.lng);

        if (!Number.isNaN(lat) && !Number.isNaN(lng)) {
            var marker = L.marker([lat, lng], { icon: productIcon }).addTo(map);

            marker.bindPopup(
                '<div class="map-popup">' +
                    '<span class="map-popup-title">' + company.companyName + '</span>' +
                    '<div class="map-popup-address">' + company.address + '</div>' +
                    '<div class="map-popup-address">出品中の商品 ' + company.productCount + ' 件</div>' +
                    '<div class="map-popup-address">最新出品: ' + company.latestProductName + '</div>' +
                    '<a class="map-popup-link" href="' + company.url + '">この法人の商品一覧を見る</a>' +
                '</div>'
            );

            marker.on('click', function(){
                map.setView([lat, lng], 14);
                marker.openPopup();
            });
        }
    }

});

if (companies.length > 0) {
    var bounds = [];
    companies.forEach(function(company) {
        if (company.lat !== null && company.lng !== null) {
            var lat = Number(company.lat);
            var lng = Number(company.lng);
            if (!Number.isNaN(lat) && !Number.isNaN(lng)) {
                bounds.push([lat, lng]);
            }
        }
    });

    if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40] });
    }
}

</script>

{% endblock %}
